  <main class="container contact-section">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you. Whether you have a question, feedback, or want to collaborate — just drop us a message below.</p>

    <!-- Contact form -->
    <form id="contact-form" action="#" method="POST" class="enquiry-form">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="type">Type of Message:</label>
      <select id="type" name="type" required>
        <option value="">Select</option>
        <option value="question">General Question</option>
        <option value="feedback">Feedback</option>
        <option value="collaboration">Collaboration</option>
      </select>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit" class="btn">Send Message</button>
    </form>
